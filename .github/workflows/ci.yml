name: Ratchet CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run setup:python
      - run: npm run replay:generate
      - run: npm run replay:verify
      - run: npm run check
      - name: Write replay attestation
        run: node scripts/write-ci-attestation.mjs "$RUNNER_TEMP/replay-attestation.json"
      - name: Publish replay attestation
        uses: actions/upload-artifact@v4
        with:
          name: ratchet-replay-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/replay-attestation.json
          if-no-files-found: error
          retention-days: 90
